<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="Agency OS · Command Center — direction artistique et prototype interactif, sans connexion à la production.">
  <title>Command Center — Agency OS</title>
  <link rel="icon" href="assets/aurion-mark.svg" type="image/svg+xml">

<body data-theme="day">
  <a class="skip" href="#main">Accéder au contenu</a>

  <div class="app" id="app">
    <aside class="sidebar glass" id="sidebar" aria-label="Navigation principale">
      <div class="brand-wrap">
        <a href="#overview" class="brand" data-page="overview" aria-label="Command Center, accueil"><img src="assets/aurion-mark.svg" width="42" height="42" alt=""><span><strong>agency<span class="brand-os">os</span></strong><small>COMMAND CENTER</small></span></a>
        <button class="only-mobile mobile-close icon-control" id="close-nav" aria-label="Fermer le menu"><span data-icon="close"></span></button>
      </div>
      <button class="workspace" id="workspace-switch" aria-label="Espace actuel : Aurion Studio, démonstration"><span class="workspace-icon">A</span><span><b>Aurion Studio</b><small>Espace de travail</small></span><span data-icon="chevrons" class="workspace-chevron"></span></button>
      <div class="sidebar-scroll" id="sidebar-nav"></div>
      <div class="sidebar-bottom">
        <div class="sidebar-detail"><span class="beacon"></span><span><b>Mode exploration</b><small>Aucune API connectée</small></span><span data-icon="info"></span></div>

      </div>
    </aside>
    <div class="content-column">
      <header class="topbar glass" role="banner">
        <div class="topbar-left"><button class="icon-control only-mobile" id="open-nav" aria-label="Ouvrir le menu"><span data-icon="menu"></span></button><span class="breadcrumb-parent">Agency OS</span><span class="breadcrumb-slash">/</span><b id="breadcrumb-title">Vue d'ensemble</b></div>
        <div class="topbar-right"><span class="preview-tag"><span class="preview-dot"></span> PROTOTYPE</span><button class="search-control" id="open-command"><span data-icon="search"></span><span>Rechercher</span><kbd>⌘ K</kbd></button><button class="icon-control" id="toggle-theme" title="Changer d'apparence" aria-label="Changer d'apparence"><span data-icon="sun"></span></button><button class="avatar-top" id="open-profile" aria-label="Ouvrir le profil">R</button></div>

      <main id="main" tabindex="-1"><div id="page-root"></div></main>
      <div class="bottom-strip"><span><span class="beacon muted"></span> Données illustratives uniquement</span><span>Agency OS / UX study — 2026</span></div>

  <div class="overlay" id="overlay" hidden></div>

  <section id="command" class="command-panel glass" role="dialog" aria-modal="true" aria-label="Recherche et commandes" hidden><div class="command-search"><span data-icon="search"></span><input id="command-input" type="search" placeholder="Rechercher une page ou une action…" autocomplete="off" aria-label="Recherche"><kbd>ESC</kbd></div><div class="command-body" id="command-results"></div><div class="command-footer"><span>↑ ↓ Naviguer</span><span>↵ Ouvrir</span><span>Échap Fermer</span></div></section>
